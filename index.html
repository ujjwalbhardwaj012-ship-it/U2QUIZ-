<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>U2QUIZ - AI Quiz Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { margin-bottom: 20px; font-size: 24px; text-align: center; color: #38bdf8; }
    input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 15px; font-size: 16px; outline: none; }
    button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #0284c7; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    #status { margin-top: 15px; text-align: center; color: #94a3b8; font-size: 14px; }
    .quiz-item { background: #334155; margin-top: 15px; padding: 15px; border-radius: 8px; }
    .quiz-item h3 { font-size: 16px; margin-bottom: 10px; }
    .options { list-style: none; }
    .options li { background: #1e293b; padding: 8px; border-radius: 4px; margin-bottom: 5px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>U2QUIZ Generator</h1>
    <input type="text" id="topicInput" placeholder="Topic name (e.g. Cricket, JavaScript, History)..." />
    <button onclick="generateQuiz()">Quiz Generate Karo</button>
    
    <div id="status"></div>
    <div id="quizContainer"></div>
  </div>

  <script>
    async function generateQuiz() {
      const topic = document.getElementById('topicInput').value;
      const status = document.getElementById('status');
      const container = document.getElementById('quizContainer');

      if (!topic) {
        alert('Kripya koi topic daliye!');
        return;
      }

      status.innerText = 'Quiz generate ho raha hai... Thoda wait karein!';
      container.innerHTML = '';

      try {
        const response = await fetch('/api/generate-quiz', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic: topic })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Server error');
        }

        status.innerText = '';
        
        data.quiz.forEach((q, index) => {
          const item = document.createElement('div');
          item.className = 'quiz-item';
          item.innerHTML = `
            <h3>Q${index + 1}: ${q.question}</h3>
            <ul class="options">
              ${q.options.map(opt => `<li>${opt}</li>`).join('')}
            </ul>
          `;
          container.appendChild(item);
        });

      } catch (err) {
        console.error(err);
        status.innerText = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
